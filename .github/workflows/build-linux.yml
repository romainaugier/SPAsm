name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf llvm
          pip install --break-system-packages Opcodes==0.3.14

      - name: Check the generated tables are up to date
        run: |
          python3 x86_64/generate.py -o x86_64_instructions.c
          python3 scripts/gperf.py
          git diff --exit-code -- x86_64 src

      - name: Build libromano
        run: |
          cd ext/libromano/ext/concurrentqueue
          ./build_c_api.sh
          cd ../..
          ./build.sh --debug --install

      - name: Build and test (debug, address sanitizer)
        run: ./build.sh --tests --debug

      - name: Differential test against llvm-mc and parser round trip
        run: |
          cd build
          ctest -R "x86_64_difftest|x86_64_parser_roundtrip" --no-tests=error --output-on-failure
